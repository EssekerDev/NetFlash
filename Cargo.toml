[workspace]
resolver = "2"
members = ["crates/netflash-core", "crates/netflash-icon", "crates/netflash-app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.80"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
netflash-core = { path = "crates/netflash-core" }
netflash-icon = { path = "crates/netflash-icon" }
tiny-skia = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "macos-system-configuration", "json"] }
hickory-resolver = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.21"
winit = "0.30"
